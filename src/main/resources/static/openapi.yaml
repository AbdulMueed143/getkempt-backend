openapi: 3.0.3
info:
  title: GetKempt API
  version: 1.0.0-rc.1
  description: |
    Salon & barbershop management platform — REST API.
    Backend contract powering the GetKempt web app, public booking widget, and
    forthcoming client / staff mobile apps.

    - All times are ISO-8601 UTC.
    - All money is in integer cents (AUD).
    - All authenticated endpoints are scoped to the calling user's shop.
    - See `docs/` in this package for prose explanations of multi-tenancy,
      the booking lifecycle, payments, and webhooks.
  contact:
    name: GetKempt Engineering
    email: engineering@getkempt.co
    url: https://getkempt.co
  license:
    name: Proprietary — Internal Use Only
  termsOfService: https://getkempt.co/terms
servers:
  - url: https://api.getkempt.co/api/v1
    description: Production
  - url: https://staging-api.getkempt.co/api/v1
    description: Staging
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - bearerJwt: []
tags:
  - name: Auth
    description: Signup, login, password reset, token refresh.
  - name: Users
    description: Current user account + personal profile.
  - name: Staff
    description: Staff members of the shop (owner / manager / staff roles).
  - name: Clients
    description: Customer records — created automatically on first booking.
  - name: Services
    description: Service catalogue (haircut, manicure, etc.).
  - name: Packages
    description: Bundles of ≥ 2 services with an optional discount.
  - name: Bookings
    description: Appointments — the heart of the system.
  - name: Availability
    description: Per-staff weekly schedules + date-specific overrides.
  - name: Visits
    description: Post-appointment review (attended / no-show).
  - name: Loyalty
    description: Sequential loyalty programs and per-client progression.
  - name: Store
    description: Tenant-level profile and settings.
  - name: Campaigns
    description: Async broadcast email / SMS / push to client segments.
  - name: Reminders
    description: Automated reminder rule engine for booking events.
  - name: Dashboard
    description: Aggregated stats and charts powering the home page.
  - name: Payments
    description: Stripe Connect — charges, deposits, refunds, payouts.
  - name: Billing
    description: Subscription, SMS credits, invoices for the shop itself.
  - name: Notifications
    description: In-app alert bell + push-device registration.
  - name: Uploads
    description: Presigned URLs for direct-to-S3/R2 image upload.
  - name: Public
    description: Unauthenticated endpoints powering the client booking widget.
  - name: Webhooks
    description: Inbound (Stripe) and outbound (delivery callbacks) webhooks.
paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Create a new shop owner / barber account.
      description: |
        Creates a new `User` AND a tenant `StoreProfile` in one transaction.
        Sends an email verification link. Returns the auth pair so the client
        can start the onboarding flow immediately without re-logging in.

        Idempotent on `email` — second call with same email returns 409.
      operationId: signup
      security: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Exchange email + password for a token pair.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Bad credentials, unverified email, or locked account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session (server-side).
      description: |
        Adds the JWT's `jti` to the revocation set. Subsequent requests with
        the same token are 401-ed. Idempotent.
      operationId: logout
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Exchange a refresh token for a fresh access + refresh pair.
      description: |
        Refresh tokens rotate — the old refresh token is single-use. Re-using
        a refresh token is treated as a compromise and invalidates the chain.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Refresh token invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Send a password-reset email.
      description: |
        Always returns 204 — the API never reveals whether the email exists,
        to prevent account enumeration.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Set a new password using a token from the email link.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated. Issues a new token pair so the user is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: Verify an email address using the token sent on signup.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Resend the verification email to the current user.
      operationId: resendVerification
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me:
    get:
      tags:
        - Users
      summary: Get the current user.
      description: |
        Returns the `User` derived from the bearer token. Used by the frontend
        on every page load to hydrate the auth store.
      operationId: getMe
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Users
      summary: Update the current user's personal profile.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                avatarUrl:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /users/me/password:
    post:
      tags:
        - Users
      summary: Change password (current password required).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /users/me/avatar:
    put:
      tags:
        - Users
      summary: Replace the user's avatar.
      description: Pass an `uploadId` from `/uploads/presign` after PUTing the image.
      operationId: setAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uploadId
              properties:
                uploadId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags:
        - Users
      summary: Remove the avatar.
      operationId: deleteAvatar
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /users/me/sessions:
    get:
      tags:
        - Users
      summary: List active sessions for the current user.
      operationId: listSessions
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    delete:
      tags:
        - Users
      summary: Revoke all sessions except the current one.
      operationId: revokeOtherSessions
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /staff:
    get:
      tags:
        - Staff
      summary: List staff members.
      operationId: listStaff
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StaffStatus'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/StaffRole'
        - name: q
          in: query
          description: Full-text search across firstName, lastName, email.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Staff
      summary: Create a new staff member.
      description: |
        Requires `staff.write` permission (owner or manager).
        If `sendInvite` is true, emails an invitation link.
      operationId: createStaff
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/staffId'
    get:
      tags:
        - Staff
      summary: Get a single staff member.
      operationId: getStaff
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Staff
      summary: Update a staff member.
      operationId: updateStaff
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - Staff
      summary: Soft-delete a staff member.
      description: |
        Sets `deletedAt`. Historical bookings keep their staff reference.
        Future bookings assigned to this staff member are cancelled.
      operationId: deleteStaff
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff/{staffId}/services:
    parameters:
      - $ref: '#/components/parameters/staffId'
    put:
      tags:
        - Staff
      summary: Replace the set of services this staff member can perform.
      operationId: setStaffServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceIds
              properties:
                serviceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
  /staff/{staffId}/avatar:
    parameters:
      - $ref: '#/components/parameters/staffId'
    put:
      tags:
        - Staff
      summary: Set the staff member's avatar (via upload).
      operationId: setStaffAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uploadId
              properties:
                uploadId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
    delete:
      tags:
        - Staff
      summary: Remove the staff member's avatar.
      operationId: deleteStaffAvatar
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /staff/{staffId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/staffId'
    post:
      tags:
        - Staff
      summary: Mark a staff member as inactive (cannot log in, hidden from bookings).
      operationId: deactivateStaff
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
  /staff/{staffId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/staffId'
    post:
      tags:
        - Staff
      summary: Restore an inactive staff member.
      operationId: reactivateStaff
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
  /staff/invitations:
    get:
      tags:
        - Staff
      summary: List outstanding staff invitations.
      operationId: listInvitations
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffInvitation'
    post:
      tags:
        - Staff
      summary: Send a new staff invitation.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/StaffRole'
                staffId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Link the invite to an existing staff record.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInvitation'
        '409':
          $ref: '#/components/responses/Conflict'
  /staff/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Staff
      summary: Revoke an outstanding invitation.
      operationId: revokeInvitation
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /staff/invitations/{invitationId}/resend:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Staff
      summary: Resend the invitation email.
      operationId: resendInvitation
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInvitation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /clients:
    get:
      tags:
        - Clients
      summary: List clients.
      operationId: listClients
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - name: q
          in: query
          description: Search across name, email, phone.
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: preferredStaffId
          in: query
          schema:
            type: string
            format: uuid
        - name: hasUpcoming
          in: query
          description: Filter to clients with a future booking.
          schema:
            type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Client'
    post:
      tags:
        - Clients
      summary: Create a client.
      operationId: createClient
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '409':
          $ref: '#/components/responses/Conflict'
  /clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      tags:
        - Clients
      summary: Get a client.
      operationId: getClient
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Clients
      summary: Update a client.
      operationId: updateClient
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Clients
      summary: Soft-delete a client.
      operationId: deleteClient
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /clients/{clientId}/bookings:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      tags:
        - Clients
      summary: List a client's booking history.
      operationId: listClientBookings
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Booking'
  /clients/{clientId}/notes:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      tags:
        - Clients
      summary: List notes attached to a client.
      operationId: listClientNotes
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientNote'
    post:
      tags:
        - Clients
      summary: Add a note to a client.
      operationId: createClientNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 4000
                pinned:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientNote'
  /clients/{clientId}/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Clients
      summary: Edit a client note.
      operationId: updateClientNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                pinned:
                  type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientNote'
    delete:
      tags:
        - Clients
      summary: Delete a client note.
      operationId: deleteClientNote
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /clients/{clientId}/loyalty:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      tags:
        - Clients
      summary: Get a client's loyalty progress and earned rewards.
      operationId: getClientLoyalty
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  progress:
                    $ref: '#/components/schemas/ClientLoyaltyProgress'
                  rewards:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoyaltyReward'
  /clients/{clientId}/merge:
    parameters:
      - $ref: '#/components/parameters/clientId'
    post:
      tags:
        - Clients
      summary: Merge a duplicate client record into this one.
      description: |
        Reassigns all bookings, notes and loyalty progress from the source
        client to this client, then soft-deletes the source. Irreversible.
      operationId: mergeClient
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientMergeRequest'
      responses:
        '200':
          description: Merged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /clients/search:
    get:
      tags:
        - Clients
      summary: Lightweight client search (used by the booking form autocomplete).
      operationId: searchClients
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - $ref: '#/components/parameters/limit'
      responses:
