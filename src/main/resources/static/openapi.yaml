        inApp:
          type: object
          additionalProperties:
            type: boolean
        email:
          type: object
          additionalProperties:
            type: boolean
        push:
          type: object
          additionalProperties:
            type: boolean
    UploadPresignRequest:
      type: object
      required:
        - purpose
        - filename
        - contentType
        - sizeBytes
      properties:
        purpose:
          type: string
          enum:
            - staff_avatar
            - service_image
            - package_image
            - store_logo
            - client_attachment
        filename:
          type: string
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/heic
        sizeBytes:
          type: integer
          maximum: 10485760
          description: Max 10 MB.
    UploadPresignResponse:
      type: object
      required:
        - uploadId
        - uploadUrl
        - fields
        - key
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Direct-PUT URL (S3) or POST URL (multipart).
        fields:
          type: object
          additionalProperties:
            type: string
          description: Form fields to include in the upload (S3 POST policy).
        key:
          type: string
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    UploadConfirmResponse:
      type: object
      required:
        - key
        - url
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
    PublicShop:
      type: object
      required:
        - slug
        - shopName
        - businessType
        - address
        - timezone
      properties:
        slug:
          type: string
        shopName:
          type: string
        businessType:
          $ref: '#/components/schemas/BusinessType'
        description:
          type: string
          nullable: true
        logo:
          $ref: '#/components/schemas/ImageRef'
          nullable: true
        address:
          $ref: '#/components/schemas/StoreAddress'
        phone:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
        instagram:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        bookingPolicy:
          type: string
          nullable: true
        cancellationPolicy:
          type: string
          nullable: true
    PublicService:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - price
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/ServiceCategory'
        image:
          $ref: '#/components/schemas/ImageRef'
          nullable: true
        durationMinutes:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
        depositRequired:
          type: boolean
        depositAmount:
          $ref: '#/components/schemas/Money'
          nullable: true
    PublicStaff:
      type: object
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string
        specialization:
          type: string
        avatarImage:
          $ref: '#/components/schemas/ImageRef'
          nullable: true
        avatarColor:
          $ref: '#/components/schemas/Color'
        services:
          type: array
          items:
            type: string
            format: uuid
    PublicBookingCreateRequest:
      type: object
      required:
        - staffId
        - startAt
        - client
      properties:
        staffId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
          nullable: true
        packageId:
          type: string
          format: uuid
          nullable: true
        startAt:
          $ref: '#/components/schemas/Timestamp'
        client:
          type: object
          required:
            - firstName
            - lastName
            - email
            - phone
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            marketingOptIn:
              type: boolean
              default: false
        notes:
          type: string
        captchaToken:
          type: string
          description: hCaptcha / reCAPTCHA token.
    PublicBookingResponse:
      type: object
      required:
        - bookingId
        - token
        - status
        - requiresPayment
      properties:
        bookingId:
          type: string
          format: uuid
        token:
          type: string
          description: Opaque token for the public client to manage this booking.
        status:
          $ref: '#/components/schemas/BookingStatus'
        requiresPayment:
          type: boolean
        paymentIntent:
          $ref: '#/components/schemas/PaymentIntent'
          nullable: true
          description: Returned when deposit / full payment is required.
        manageUrl:
          type: string
          format: uri
  responses:
    BadRequest:
      description: Malformed request — JSON parse error, invalid query, etc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_request
            message: Malformed JSON body
            requestId: req_01HRMK4N9X3T7Q
    Conflict:
      description: Conflict — duplicate, overlapping slot, version mismatch, etc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: Time slot is no longer available
    UnprocessableEntity:
      description: Request body parsed but failed business validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            code: validation_failed
            message: One or more fields are invalid
            fields:
              - field: email
                message: Must be a valid email address
              - field: price
                message: Must be ≥ 0
    TooManyRequests:
      description: Rate limit exceeded. Retry after the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many requests — retry in 30s
    NoContent:
      description: Operation succeeded — empty body.
    Unauthorized:
      description: Missing, expired, or revoked access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Access token has expired
            requestId: req_01HRMK4N9X3T7Q
    Forbidden:
      description: Authenticated but the role / permission lacks the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Role 'staff' cannot delete bookings created by other users
            requestId: req_01HRMK4N9X3T7Q
    NotFound:
      description: Resource does not exist OR the caller's shop has no access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Booking with id bk_… not found
    PreconditionFailed:
      description: Optimistic-lock `If-Match` mismatch — entity was updated concurrently.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
