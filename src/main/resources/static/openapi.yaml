  /campaigns:
    get:
      tags:
        - Campaigns
      summary: List campaigns.
      operationId: listCampaigns
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CampaignStatus'
        - name: channel
          in: query
          schema:
            $ref: '#/components/schemas/CampaignChannel'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Campaign'
    post:
      tags:
        - Campaigns
      summary: Dispatch a campaign (immediate or scheduled).
      description: |
        The endpoint queues a job and returns immediately. SMS campaigns
        decrement SMS credits — call `/campaigns/estimate` first to validate.
      operationId: dispatchCampaign
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignPayload'
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '402':
          description: Insufficient SMS credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/campaignId'
    get:
      tags:
        - Campaigns
      summary: Get a campaign.
      operationId: getCampaign
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
  /campaigns/{campaignId}/cancel:
    parameters:
      - $ref: '#/components/parameters/campaignId'
    post:
      tags:
        - Campaigns
      summary: Cancel a scheduled or in-flight campaign.
      description: |
        Already-sent messages cannot be recalled — only pending deliveries are stopped.
      operationId: cancelCampaign
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '409':
          description: Campaign already completed.
  /campaigns/estimate:
    post:
