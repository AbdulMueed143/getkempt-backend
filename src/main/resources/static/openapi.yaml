      summary: Create a booking from the public widget.
      description: |
        Creates (or matches by email/phone) a client record, then books.
        If the shop requires a deposit / full upfront payment, returns a
        `PaymentIntent` that the widget must confirm with Stripe.js. Until
        the intent succeeds, the booking is held in `pending` for 10 minutes
        then auto-cancels.
      operationId: createPublicBooking
      security: []
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBookingCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /public/bookings/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Public
      summary: Look up a public booking by its token (self-service portal).
      description: |
        The booking response carries an opaque `token`; the manage URL embeds
        it as the path segment. Token is single-shop scoped and expires after
        the appointment date + 30 days.
      operationId: getPublicBooking
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/bookings/{token}/cancel:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Public
      summary: Cancel a booking from the client-side self-service link.
      description: |
        Cancellation rules: respects the shop's policy. If within a fee window,
        the response contains the fee amount and a confirmation flag the
        client must echo back.
      operationId: cancelPublicBooking
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                acceptFee:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
                  feeCharged:
                    $ref: '#/components/schemas/Money'
                    nullable: true
        '402':
          description: A cancellation fee applies — re-submit with `acceptFee=true` to proceed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeAmount:
                    $ref: '#/components/schemas/Money'
                  policy:
                    type: string
  /webhooks/stripe:
    post:
      tags:
        - Webhooks
      summary: Stripe webhook ingress.
      description: |
        Handles the events:
          - `payment_intent.succeeded` — capture funds, mark booking paid
          - `payment_intent.payment_failed` — surface alert + retry logic
          - `charge.refunded` — sync refund state
          - `payout.paid` — bell alert
          - `account.updated` — refresh ConnectStatus
          - `invoice.paid` — for our own subscription billing
          - `customer.subscription.updated` / `.deleted`

        Idempotent on Stripe's `event.id`.
      operationId: stripeWebhook
      security:
        - apiKey: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload — see Stripe docs.
      responses:
        '200':
          description: Acknowledged.
        '400':
          description: Invalid signature.
  /webhooks/twilio/sms-status:
    post:
      tags:
        - Webhooks
      summary: Twilio SMS delivery status webhook.
      description: |
        Updates the per-reminder / per-campaign-recipient delivery status
        (queued → sent → delivered / undelivered / failed).
      operationId: twilioStatusWebhook
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                MessageSid:
                  type: string
                MessageStatus:
                  type: string
                To:
                  type: string
                ErrorCode:
                  type: string
      responses:
        '200':
          description: Acknowledged.
  /webhooks/sendgrid/email-status:
    post:
      tags:
        - Webhooks
      summary: SendGrid email event webhook (open, click, bounce, etc.).
      operationId: sendgridEventWebhook
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Array of SendGrid events — see SendGrid docs.
              items:
                type: object
      responses:
        '200':
          description: Acknowledged.
  /webhooks/expo/push-status:
    post:
      tags:
        - Webhooks
      summary: Expo push notification delivery receipt webhook.
      operationId: expoPushStatusWebhook
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Acknowledged.
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Standard OAuth2 / RFC-6750 bearer token.
        Issued by `POST /auth/login` and refreshed via `POST /auth/refresh`.

        Header:
        ```
        Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI…
        ```
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Per-tenant integration key. Created and revoked from the shop settings UI.
        Has the same role/permission model as a user token but never expires.
    webhookSignature:
      type: apiKey
      in: header
      name: X-GetKempt-Signature
      description: |
        HMAC-SHA256 signature of the raw request body, keyed on the per-tenant
        webhook secret. Required on `/webhooks/*` ingress endpoints.

        Format: `t=<unix_ts>,v1=<hex_digest>`
        The receiver MUST reject requests where `|now - t| > 300s`.
  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-supplied UUID v4. Server MUST cache the response for 24h and
        return the same result on retry. Required on all POST / PUT / PATCH
        that have side effects.
      required: false
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      description: Opaque base64 cursor returned by the previous page response.
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Max items to return. Default 25, max 100.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    sort:
      name: sort
      in: query
      description: |
        Sort key prefixed with `-` for descending. Default per-endpoint.
        Examples: `-createdAt`, `lastName`, `-totalBookings`.
      required: false
      schema:
        type: string
    staffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ifMatch:
      name: If-Match
      in: header
      description: |
        Optimistic concurrency control. Pass the `version` returned in the
        last GET. Server returns 412 Precondition Failed on stale writes.
      required: false
      schema:
        type: string
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    serviceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    packageId:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    fromDate:
      name: from
      in: query
      description: Inclusive lower bound (ISO-8601 UTC).
      required: false
      schema:
        type: string
        format: date-time
    toDate:
      name: to
      in: query
      description: Exclusive upper bound (ISO-8601 UTC).
      required: false
      schema:
        type: string
        format: date-time
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    appointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    programId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    rewardId:
      name: rewardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ruleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    saleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    shopSlug:
      name: slug
      in: path
      description: URL-safe public identifier of the shop (e.g. `heritage-barbershop`).
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9-]{3,80}$
  schemas:
    SignupRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - businessName
        - role
        - password
        - placeId
        - agreeToTerms
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        businessName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
            - barber
            - salon_owner
        password:
          type: string
          format: password
          minLength: 8
          description: Must include ≥1 uppercase and ≥1 digit.
        placeId:
          type: string
          description: |
            Google Place id for the shop's listing, selected via the frontend's Place Autocomplete widget. The ONLY location input signup accepts — address, geo-coordinates, rating, and photos are all resolved server-side from this id and are never free-typed. A lookup failure never blocks signup; it just leaves the enrichment fields blank until re-synced.
        agreeToTerms:
          type: boolean
          enum:
            - true
    UserRole:
      type: string
      enum:
        - barber
        - salon_owner
        - admin
      description: Account-level role — distinct from `StaffRole` which is per-shop.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC, e.g. `2026-03-12T04:30:00Z`.
    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        businessName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        shopId:
          type: string
          format: uuid
          nullable: true
          description: Tenant the user belongs to. Null for unowned admins.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Short-lived (15 min) JWT for the Authorization header.
        refreshToken:
          type: string
          description: Long-lived (30 day) opaque token. Stored as httpOnly cookie + body.
        expiresIn:
          type: integer
          description: Seconds until accessToken expires.
          example: 900
        tokenType:
          type: string
          default: Bearer
    AuthSession:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code (snake_case).
          example: not_found
        message:
          type: string
          description: Human-readable summary suitable for displaying to the end user.
        requestId:
          type: string
          description: Server-assigned trace id for log lookups.
        docsUrl:
          type: string
          format: uri
          description: Optional link to the relevant section of the developer docs.
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - fields
          properties:
            fields:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    description: JSON-pointer-ish path, e.g. `services[0].price`.
                  message:
                    type: string
                  code:
                    type: string
                    description: Field-level code, e.g. `too_short`, `invalid_email`.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
        rememberMe:
          type: boolean
          default: false
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: From the password reset email link.
        password:
          type: string
          format: password
          minLength: 8
    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    Session:
      type: object
      description: Active sign-in session — listed under `/users/me/sessions`.
      required:
        - id
        - createdAt
        - lastSeenAt
        - current
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
          nullable: true
          example: Chrome on Mac
        ip:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
          example: Melbourne, AU
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
    StaffStatus:
      type: string
      enum:
        - active
        - on_leave
        - inactive
    StaffRole:
      type: string
      enum:
        - owner
        - manager
        - staff
    PageInfo:
      type: object
      required:
        - hasNextPage
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `?cursor=` for the next page.
        hasNextPage:
          type: boolean
        totalCount:
          type: integer
          description: Only returned when cheap to compute; treat as advisory.
    Page:
      type: object
      description: Standard envelope returned by every list endpoint.
      required:
        - data
        - pageInfo
      properties:
        data:
          type: array
          items: {}
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    ImageRef:
      type: object
      description: A stored image — only the `key` is canonical; `url` is signed/CDN.
      required:
        - key
        - url
      properties:
        key:
          type: string
          description: Storage key, e.g. `staff/s1/avatar.webp`.
        url:
          type: string
          format: uri
          description: CDN or signed URL the client should display.
        width:
          type: integer
        height:
          type: integer
    Color:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
      description: 6-digit hex colour, lowercase preferred.
      example: '#1B3163'
    CommissionType:
      type: string
      enum:
        - hourly
        - commission
        - salary
    StaffMember:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - role
        - status
        - services
        - commissionType
        - avatarColor
        - calendarColor
        - startDate
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
          description: Linked user account if the staff member can log in.
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164 format preferred.
        bio:
          type: string
          maxLength: 500
        specialization:
          type: string
          maxLength: 100
        avatarImage:
          $ref: '#/components/schemas/ImageRef'
          nullable: true
        avatarColor:
          $ref: '#/components/schemas/Color'
        calendarColor:
          $ref: '#/components/schemas/Color'
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          $ref: '#/components/schemas/StaffStatus'
        services:
          type: array
          items:
            type: string
            format: uuid
          description: Service IDs the staff member can perform.
        commissionType:
          $ref: '#/components/schemas/CommissionType'
        commissionRate:
          type: number
          format: float
          nullable: true
          description: |
            Meaning depends on commissionType:
              hourly     → AUD per hour
              commission → 0-100 (%) of service price
              salary     → annual AUD
        startDate:
          type: string
          format: date
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          type: string
          format: date-time
          nullable: true
    StaffCreateRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - role
        - services
        - commissionType
        - startDate
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        bio:
          type: string
        specialization:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          $ref: '#/components/schemas/StaffStatus'
          default: active
        services:
          type: array
          items:
            type: string
            format: uuid
        commissionType:
          $ref: '#/components/schemas/CommissionType'
        commissionRate:
          type: number
          nullable: true
        startDate:
          type: string
          format: date
        avatarColor:
          $ref: '#/components/schemas/Color'
        calendarColor:
          $ref: '#/components/schemas/Color'
        sendInvite:
          type: boolean
          default: true
          description: When true, send an email invitation so the staff member can log in.
    StaffInvitation:
      type: object
      required:
        - id
        - email
        - role
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          type: string
          enum:
            - pending
            - accepted
            - expired
            - revoked
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Client:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - totalBookings
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        totalBookings:
          type: integer
          minimum: 0
        lifetimeSpendCents:
          type: integer
          minimum: 0
        lastBookingDate:
          type: string
          format: date-time
          nullable: true
        nextBookingDate:
          type: string
          format: date-time
          nullable: true
        preferredStaffId:
          type: string
          format: uuid
          nullable: true
        joinedAt:
          type: string
          format: date-time
        marketingOptIn:
          type: boolean
          default: true
        smsOptIn:
          type: boolean
          default: true
        emailOptIn:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true
          description: One-line summary; full notes are in `ClientNote`.
        tags:
          type: array
          items:
            type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          type: string
          format: date-time
          nullable: true
    ClientCreateRequest:
      type: object
      required:
        - firstName
        - lastName
        - phone
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
        preferredStaffId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        marketingOptIn:
          type: boolean
          default: true
    BookingStatus:
      type: string
      enum:
        - pending
        - confirmed
        - in_progress
        - completed
        - cancelled
        - no_show
    Money:
      type: object
      description: All monetary values in the API. Whole cents — never floats.
      required:
        - amountCents
        - currency
      properties:
        amountCents:
          type: integer
          minimum: 0
          example: 6500
        currency:
          type: string
          enum:
            - AUD
          default: AUD
    BookingSource:
      type: string
      enum:
        - app
        - manual
        - walk_in
        - online_widget
        - recurring
    CancellationReason:
      type: string
      enum:
        - client_request
        - staff_unavailable
        - shop_closed
        - no_show
        - other
    InStoreMethod:
      type: string
      enum:
        - card
        - cash
        - bank_transfer
    AppliedSurcharge:
      type: object
      required:
        - label
        - amount
      properties:
        label:
          type: string
          example: Public Holiday Surcharge
        type:
          type: string
          enum:
            - percentage
            - fixed_aud
        value:
          type: number
          description: Source value (e.g. 25 = 25%).
        amount:
          $ref: '#/components/schemas/Money'
    Booking:
      type: object
      required:
        - id
        - clientName
        - staffId
        - staffName
        - serviceName
        - durationMinutes
        - price
        - startAt
        - endAt
        - status
        - source
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
          nullable: true
          description: Null only for walk-ins without a saved client record.
        clientName:
          type: string
        clientPhone:
          type: string
          nullable: true
        clientEmail:
          type: string
          format: email
          nullable: true
        staffId:
          type: string
          format: uuid
        staffName:
          type: string
        serviceId:
          type: string
          format: uuid
          nullable: true
        packageId:
          type: string
          format: uuid
          nullable: true
        serviceName:
          type: string
          description: Snapshotted at booking time — survives service edits.
        durationMinutes:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
        startAt:
          $ref: '#/components/schemas/Timestamp'
        endAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/BookingStatus'
        source:
          $ref: '#/components/schemas/BookingSource'
        notes:
          type: string
          nullable: true
