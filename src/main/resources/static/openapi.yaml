  /store/settings:
    get:
      tags:
        - Store
      summary: Get store settings (scheduling + payment + policies).
      operationId: getStoreSettings
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettings'
    patch:
      tags:
        - Store
      summary: Update store settings.
      operationId: updateStoreSettings
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSettings'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettings'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /store/holidays:
    get:
      tags:
        - Store
      summary: List holidays / closures.
      operationId: listHolidays
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
    post:
      tags:
        - Store
      summary: Add a custom holiday.
      operationId: createHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - date
              properties:
                name:
                  type: string
                date:
                  type: string
                  format: date
                appliesTo:
                  oneOf:
                    - type: string
                      enum:
                        - all
                    - type: array
