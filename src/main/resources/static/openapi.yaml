                  - discountedPrice
                  - effectiveDurationMinutes
                properties:
                  basePrice:
                    $ref: '#/components/schemas/Money'
                  discountedPrice:
                    $ref: '#/components/schemas/Money'
                  discountAmount:
                    $ref: '#/components/schemas/Money'
                  effectiveDurationMinutes:
                    type: integer
  /bookings:
    get:
      tags:
        - Bookings
      summary: List bookings.
      description: |
        The general-purpose list endpoint. For calendar views, prefer
        `/bookings/calendar` which is optimised for date-range fetches and
        includes staff colour metadata.
      operationId: listBookings
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - name: staffId
          in: query
          schema:
            type: string
            format: uuid
        - name: clientId
          in: query
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BookingStatus'
          style: form
          explode: true
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/BookingSource'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Booking'
    post:
      tags:
        - Bookings
      summary: Create a booking.
      description: |
        The endpoint is transactional:
          1. Validates the slot against weekly schedule, overrides, and existing bookings.
          2. Creates a `Client` inline if `client` is provided.
          3. Snapshots service name/price/duration onto the booking row.
          4. Computes applicable surcharges from settings.
          5. If the shop's `paymentMode` requires a deposit, creates a
             `PaymentIntent` and returns it in the response so the frontend
             can confirm with Stripe.js.
          6. Schedules reminder jobs per the reminder rules.
          7. Pushes a notification to the bell of staff & owner.

        Returns 409 if the slot is no longer available (race condition).
        Pass `skipConflictCheck=true` (owner only) to force-book.
      operationId: createBooking
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - booking
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
                  paymentIntent:
                    $ref: '#/components/schemas/PaymentIntent'
                    nullable: true
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    get:
      tags:
        - Bookings
      summary: Get a booking.
      operationId: getBooking
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Bookings
      summary: Update a booking's mutable fields (notes, etc.).
      description: |
        Use the dedicated endpoints for state changes / time changes:
          - `/cancel`, `/reschedule`, `/confirm`, `/complete`, `/no-show`
      operationId: updateBooking
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
        - Bookings
      summary: Hard-delete a draft booking.
      description: |
        Only valid for bookings in `pending` status created in the last 5 min.
        Confirmed bookings must be cancelled via `/cancel`.
      operationId: deleteBooking
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '409':
          $ref: '#/components/responses/Conflict'
  /bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    post:
      tags:
        - Bookings
      summary: Cancel a booking.
      description: |
        Side effects:
          - Frees the slot for re-booking.
          - If `chargeFee=true`, applies the shop's cancellation fee policy.
          - Triggers the `booking_cancelled` reminder rule.
      operationId: cancelBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: Already cancelled / completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{bookingId}/reschedule:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    post:
      tags:
        - Bookings
      summary: Move a booking to a new time / staff member.
      description: |
        Re-runs conflict checks at the new slot. Sends `booking_rescheduled`
        reminder. Preserves payment intents.
      operationId: rescheduleBooking
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
  /bookings/{bookingId}/confirm:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    post:
      tags:
        - Bookings
      summary: Move a booking from `pending` to `confirmed`.
      operationId: confirmBooking
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{bookingId}/complete:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    post:
      tags:
        - Bookings
      summary: Mark a booking as completed.
      description: |
        Side effects:
          - Captures any uncaptured PaymentIntent.
          - Increments client lifetime spend + booking count.
          - Advances loyalty progress.
      operationId: completeBooking
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actualEndAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: Override the recorded end time if the visit ran short/long.
                tip:
                  $ref: '#/components/schemas/Money'
                  nullable: true
                inStoreMethod:
                  $ref: '#/components/schemas/InStoreMethod'
                  nullable: true
                  description: |
                    How payment was actually taken in person, when the booking has no online PaymentIntent (paymentMode=in_store, or any booking whose price wasn't collected online). Must be one of the shop's StoreSettings.inStoreMethods allow-list; omit if payment was already collected online (paymentIntentId set) or isn't being recorded.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{bookingId}/no-show:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    post:
      tags:
        - Bookings
      summary: Mark a booking as a no-show.
      description: |
        Triggers the no-show fee charge if the shop's settings auto-charge.
        The fee amount is computed from `StoreSettings.noShowFeeType/Value`.
      operationId: markBookingNoShow
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                chargeFee:
                  type: boolean
                  description: Defaults to the shop's autoCharge setting.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/{bookingId}/notes:
    parameters:
      - $ref: '#/components/parameters/bookingId'
    put:
      tags:
        - Bookings
      summary: Replace the booking's free-text notes.
      operationId: setBookingNotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                notes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /bookings/calendar:
    get:
      tags:
        - Bookings
      summary: Calendar-optimised booking feed (day/week/month).
      description: |
        Returns flattened booking blocks for a date range, including the
        staff colour and overlap-lane metadata used by the front-end's
        multi-lane time-grid layout.

        Always returns the FULL range — no pagination — so callers should
        keep ranges to ≤ 31 days. Cache-friendly with `ETag` + `If-None-Match`.
      operationId: getCalendar
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: staffIds
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: includeBreaks
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - bookings
                  - breaks
                  - holidays
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  breaks:
                    type: array
                    description: Non-bookable time blocks (lunch, prep, leave).
                    items:
                      type: object
                      properties:
                        staffId:
                          type: string
                          format: uuid
                        startAt:
                          type: string
                          format: date-time
                        endAt:
                          type: string
                          format: date-time
                        label:
                          type: string
                  holidays:
                    type: array
                    items:
                      $ref: '#/components/schemas/Holiday'
  /bookings/slots/search:
    post:
      tags:
        - Bookings
      summary: Search for available time slots for a service / date.
      description: |
        The primary helper for the **Create booking** form's "Date & Slot" step.
        Slots are computed live from staff weekly schedules MINUS existing
        bookings MINUS overrides MINUS holidays. Respects the shop's
        `slotInterval` setting.
      operationId: searchSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotSearchRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - slots
                properties:
                  slots:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableSlot'
  /bookings/conflicts/check:
    post:
      tags:
        - Bookings
      summary: Check whether a proposed booking would conflict.
      description: |
        Light-weight pre-check used by the form while the user picks staff/time,
        to surface conflicts before they hit Submit.
      operationId: checkConflicts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictCheckRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictCheckResponse'
  /bookings/bulk:
    post:
      tags:
        - Bookings
      summary: Apply an action to multiple bookings at once.
      operationId: bulkBookings
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingBulkRequest'
      responses:
        '200':
          description: Summary of per-id outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: array
                    items:
                      type: string
                      format: uuid
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        reason:
                          type: string
  /bookings/export:
    post:
      tags:
        - Bookings
      summary: Export bookings as CSV.
      operationId: exportBookings
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                status:
                  type: array
                  items:
                    $ref: '#/components/schemas/BookingStatus'
      responses:
        '202':
          description: Export queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
  /bookings/ical:
    get:
      tags:
        - Bookings
      summary: Subscribe URL for ICS calendar feed (staff personal calendar).
      description: |
        Returns a signed URL the staff member can plug into Google / Apple
        Calendar. Read-only. The URL contains a per-user secret — never
        embed in URLs you don't trust.
      operationId: getIcalFeed
      parameters:
        - name: staffId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            description: Defaults to the calling staff member.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
  /availability/{staffId}/weekly:
    parameters:
      - $ref: '#/components/parameters/staffId'
    get:
      tags:
        - Availability
      summary: Get a staff member's recurring weekly schedule.
      operationId: getWeeklySchedule
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySchedule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Availability
      summary: Replace the weekly schedule.
      operationId: setWeeklySchedule
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timezone
                - days
              properties:
                timezone:
                  type: string
                days:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    $ref: '#/components/schemas/DaySchedule'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySchedule'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: Time slots overlap, end ≤ start, or > 24h day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /availability/{staffId}/overrides:
    parameters:
      - $ref: '#/components/parameters/staffId'
    get:
      tags:
        - Availability
      summary: List date-specific overrides for a staff member.
      operationId: listOverrides
      parameters:
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityOverride'
    post:
      tags:
        - Availability
      summary: Create a date override.
      description: |
        Used for sick days, half-days, or one-off extended hours.
        Overrides take precedence over the weekly schedule on the given date.
      operationId: createOverride
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - isWorking
              properties:
                date:
                  type: string
                  format: date
                isWorking:
                  type: boolean
                slots:
                  type: array
                  items:
                    $ref: '#/components/schemas/TimeSlot'
                note:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityOverride'
        '409':
          description: An override already exists for this date — use PATCH on /overrides/{id}.
  /availability/{staffId}/overrides/{overrideId}:
    parameters:
      - $ref: '#/components/parameters/staffId'
      - name: overrideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Availability
      summary: Update an existing override.
      operationId: updateOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isWorking:
                  type: boolean
                slots:
                  type: array
                  items:
                    $ref: '#/components/schemas/TimeSlot'
                note:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityOverride'
    delete:
      tags:
        - Availability
      summary: Delete an override (returns to the recurring schedule for that date).
      operationId: deleteOverride
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /availability/{staffId}/copy:
    parameters:
      - $ref: '#/components/parameters/staffId'
    post:
      tags:
        - Availability
      summary: Copy this staff member's schedule onto other staff.
      description: |
        Convenience endpoint used by the "Apply same hours to other staff"
        button on the Availability page.
      operationId: copySchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCopyRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appliedTo:
                    type: array
                    items:
                      type: string
                      format: uuid
  /availability/{staffId}/timeline:
    parameters:
      - $ref: '#/components/parameters/staffId'
    get:
      tags:
        - Availability
      summary: Flattened day-by-day availability (working / off / partial).
      description: |
        Returns a compact array of `{date, status}` over a date range —
        ideal for rendering availability dots on a calendar picker.
      operationId: getAvailabilityTimeline
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    status:
                      type: string
                      enum:
                        - 'off'
                        - working
                        - partial
                        - override
                    totalMinutes:
                      type: integer
  /availability/{staffId}/breaks:
    parameters:
      - $ref: '#/components/parameters/staffId'
    get:
      tags:
        - Availability
      summary: List recurring break slots for the staff member.
      operationId: listBreaks
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
    post:
      tags:
        - Availability
      summary: Add a recurring break slot to all working days.
      operationId: createBreak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startTime
                - endTime
              properties:
                startTime:
                  type: string
                endTime:
                  type: string
                label:
                  type: string
                days:
                  type: array
                  description: When empty, applies to all working days.
                  items:
                    $ref: '#/components/schemas/DayOfWeek'
      responses:
        '201':
          description: Created.
  /availability/{staffId}/breaks/{breakId}:
    parameters:
      - $ref: '#/components/parameters/staffId'
      - name: breakId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Availability
      summary: Remove a recurring break slot.
      operationId: deleteBreak
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /availability/bulk-update:
    post:
      tags:
        - Availability
      summary: Update many staff schedules in one transaction.
      description: Owner-only. Used by the "shop-wide hours" wizard.
      operationId: bulkUpdateAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - updates
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required:
                      - staffId
                      - days
                    properties:
                      staffId:
                        type: string
                        format: uuid
                      days:
                        type: array
                        items:
                          $ref: '#/components/schemas/DaySchedule'
      responses:
        '200':
          description: OK.
  /availability/holidays:
    get:
      tags:
        - Availability
      summary: List shop-wide closures affecting availability.
      description: Alias of `/store/holidays` — returned here for client convenience.
      operationId: getAvailabilityHolidays
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
  /visits:
    get:
      tags:
        - Visits
      summary: List visits (past appointments).
      operationId: listVisits
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - name: status
          in: query
          description: Filter by review status — most common = pending.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AppointmentStatus'
          style: form
          explode: true
        - name: staffId
          in: query
          schema:
            type: string
            format: uuid
        - name: clientId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AppointmentRecord'
  /visits/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    get:
      tags:
        - Visits
      summary: Get a single appointment record.
      operationId: getVisit
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRecord'
        '404':
          $ref: '#/components/responses/NotFound'
  /visits/{appointmentId}/mark-attended:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    post:
      tags:
        - Visits
      summary: Mark an appointment as attended.
      description: |
        Equivalent to completing the underlying booking. Advances loyalty,
        increments client lifetime spend, and captures any deposit.
      operationId: markAttended
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitMarkRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRecord'
  /visits/{appointmentId}/mark-no-show:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    post:
      tags:
        - Visits
      summary: Mark an appointment as a no-show.
      description: |
        Applies the no-show fee per `StoreSettings` if auto-charge is enabled.
        Optionally accepts an explanatory note (recorded on the appointment).
      operationId: markNoShow
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitMarkRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRecord'
  /visits/bulk:
    post:
      tags:
        - Visits
      summary: Bulk-mark multiple appointments.
      operationId: bulkVisits
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitBulkRequest'
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: array
                    items:
                      type: string
                      format: uuid
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        reason:
                          type: string
  /visits/stats:
    get:
      tags:
        - Visits
      summary: Aggregate stats powering the Visits page header.
      operationId: getVisitStats
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitStats'
  /loyalty/programs:
    get:
      tags:
        - Loyalty
      summary: List loyalty programs (in sequence order).
      operationId: listLoyaltyPrograms
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProgramStatus'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoyaltyProgram'
    post:
      tags:
        - Loyalty
      summary: Create a loyalty program.
      operationId: createLoyaltyProgram
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyProgramCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /loyalty/programs/{programId}:
    parameters:
      - $ref: '#/components/parameters/programId'
    get:
      tags:
        - Loyalty
      summary: Get a loyalty program.
      operationId: getLoyaltyProgram
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Loyalty
      summary: Update a loyalty program.
      description: |
        Editing reward or trigger after issuance only affects clients who have
        not yet earned the reward — those already earned keep the original terms.
      operationId: updateLoyaltyProgram
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyProgramCreateRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
    delete:
      tags:
        - Loyalty
      summary: Soft-delete a loyalty program.
      operationId: deleteLoyaltyProgram
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '409':
          description: Cannot delete — clients have pending rewards under this program.
  /loyalty/programs/{programId}/activate:
    parameters:
      - $ref: '#/components/parameters/programId'
    post:
      tags:
        - Loyalty
      summary: Activate a draft / paused program.
      operationId: activateLoyaltyProgram
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
  /loyalty/programs/{programId}/pause:
    parameters:
      - $ref: '#/components/parameters/programId'
    post:
      tags:
        - Loyalty
      summary: Pause a program — existing rewards remain redeemable.
      operationId: pauseLoyaltyProgram
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
  /loyalty/programs/{programId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/programId'
    post:
      tags:
        - Loyalty
      summary: Duplicate a program as a new draft.
      operationId: duplicateLoyaltyProgram
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProgram'
  /loyalty/programs/reorder:
    post:
      tags:
        - Loyalty
      summary: Reorder loyalty programs in the ladder.
      operationId: reorderLoyaltyPrograms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramReorderRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /loyalty/clients/{clientId}/progress:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      tags:
        - Loyalty
      summary: Get a client's loyalty progress and earned history.
      operationId: getLoyaltyClientProgress
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLoyaltyProgress'
  /loyalty/rewards:
    get:
      tags:
        - Loyalty
      summary: List earned rewards (across all clients).
      operationId: listLoyaltyRewards
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: clientId
          in: query
          schema:
            type: string
            format: uuid
        - name: programId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - redeemed
              - expired
              - revoked
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LoyaltyReward'
  /loyalty/rewards/{rewardId}/redeem:
    parameters:
      - $ref: '#/components/parameters/rewardId'
    post:
      tags:
        - Loyalty
      summary: Redeem a pending reward (typically at the next checkout).
      operationId: redeemLoyaltyReward
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Link the redemption to a specific booking.
                note:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyReward'
        '409':
          description: Already redeemed / expired / revoked.
  /loyalty/rewards/{rewardId}/revoke:
    parameters:
      - $ref: '#/components/parameters/rewardId'
    post:
      tags:
        - Loyalty
      summary: Revoke a pending reward (e.g. issued in error).
      operationId: revokeLoyaltyReward
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyReward'
  /loyalty/stats:
    get:
      tags:
        - Loyalty
      summary: Aggregate loyalty stats — earned vs redeemed, redemption rate.
      operationId: getLoyaltyStats
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEarned:
                    type: integer
                  totalRedeemed:
                    type: integer
                  redemptionRatePercent:
                    type: number
                    format: float
                  topProgram:
                    type: object
                    nullable: true
                    properties:
                      programId:
                        type: string
                        format: uuid
                      name:
                        type: string
                      count:
                        type: integer
  /store/profile:
