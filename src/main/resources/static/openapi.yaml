      description: Used to render the "send to ~120 clients" confirmation in the UI.
      operationId: estimateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filter
                - channel
              properties:
                filter:
                  $ref: '#/components/schemas/CampaignFilter'
                channel:
                  $ref: '#/components/schemas/CampaignChannel'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEstimateResponse'
  /campaigns/preview:
    post:
      tags:
        - Campaigns
      summary: Render the message with placeholders substituted (no send).
      operationId: previewCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
                - message
              properties:
                channel:
                  $ref: '#/components/schemas/CampaignChannel'
                subject:
                  type: string
                message:
                  type: string
                sampleClientId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Pick a real client to substitute their data; otherwise placeholder values.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  renderedSubject:
                    type: string
                  renderedBody:
                    type: string
                  charCount:
