              type: object
              required:
                - uploadId
              properties:
                uploadId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProfile'
    delete:
      tags:
        - Store
      summary: Remove the shop logo.
      operationId: deleteStoreLogo
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /store/profile/google-photos/{photoReference}:
    parameters:
      - name: photoReference
        in: path
