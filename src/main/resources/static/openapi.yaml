        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProfileUpdateRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProfile'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /store/profile/logo:
    put:
      tags:
        - Store
      summary: Set the shop logo.
