plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'au.com'
version = '0.0.1-SNAPSHOT'
description = 'getkempt'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Persistence — MongoDB via Spring Data
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// Web (Spring MVC) + Bean Validation.
	// Boot 4 renamed `spring-boot-starter-web` -> `spring-boot-starter-webmvc`.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// API documentation (Swagger UI serving the bundled contract).
	// springdoc 2.x targets Spring Boot 3 / Jackson 2 and fails to start on Boot 4;
	// 3.1.x is the line built against Spring Boot 4.1.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// User-Agent classification for session device names (SessionService)
	implementation 'is.tagomor.woothee:woothee-java:1.8.0'

	// JWT (JJWT 0.13.x). jjwt-jackson is the runtime serializer; it ships its own
	// Jackson 2 dependency and is independent of Boot 4's Jackson 3.
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// Argon2id password hashing (Spring Security's Argon2PasswordEncoder needs BouncyCastle)
	implementation 'org.bouncycastle:bcprov-jdk18on:1.84'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
