        - name: serviceIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: discountType
          in: query
          schema:
            $ref: '#/components/schemas/DiscountType'
        - name: discountValue
          in: query
